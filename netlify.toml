[build]
  command = "npm run build"
  publish = ".next"

[[redirects]]
  from = "/www.unboxedtogether.com/*"
  to = "/:splat"
  status = 301
  force = true

# Older and alternative book URLs go to the redesigned book page.
[[redirects]]
  from = "/buy-the-book"
  to = "/book"
  status = 301

[[redirects]]
  from = "/the-book"
  to = "/book"
  status = 301

[[redirects]]
  from = "/buy"
  to = "/book"
  status = 301

[[redirects]]
  from = "/unboxed"
  to = "/book"
  status = 301
